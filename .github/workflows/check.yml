name: Check
on: 
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Виправлено версію на v4
      - uses: actions/checkout@v4
      #- uses: actions/cache@v4.3.0
      # Переконайтеся, що цей action підтримує PHP 8.3 всередині контейнера
      - uses: Novusvetus/action-php_codesniffer@1.2.17
      - uses: Firehed/lint-php-action@v1
        with:
          php-version: '8.3' # Краще брати версію в лапки
